name: bahawatch
description: BAHAWATCH - Community Flood & Road Condition post reporting with camera + geolocation + AI
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.2.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.5.0
  geolocator: ^12.0.0
  camera: ^0.10.5
  image_picker: ^1.0.7
  dio: ^5.4.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.4.9
  exif: ^3.3.0
  cached_network_image: ^3.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
flutter:
  uses-material-design: true
